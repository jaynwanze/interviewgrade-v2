name: Generate bootstrap artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: pnpm install --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate initial Drizzle migration
        run: pnpm db:generate

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "chore: add lockfile and initial database migration"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-artifacts
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            drizzle/
          if-no-files-found: error
