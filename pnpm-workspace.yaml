packages:
  - '.'

# pnpm 11 blocks dependency build scripts by default. These packages are
# required by the framework/tooling and are explicitly allow-listed rather
# than enabling arbitrary install scripts.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.112.2'
  - '@supabase/functions-js@2.112.2'
  - '@supabase/postgrest-js@2.112.2'
  - '@supabase/realtime-js@2.112.2'
  - '@supabase/storage-js@2.112.2'
  - '@supabase/supabase-js@2.112.2'
